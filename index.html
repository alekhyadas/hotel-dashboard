<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resort Deal Dashboard</title>
<style>
  /* Public read-only mirror of the extension's dashboard. Same filters,
     sorting, and expandable per-hotel dates, just no Hide/AI/YouTube
     buttons, since those need chrome.storage and local API keys this
     page doesn't have access to. It only ever reads data.json published
     alongside it. */
  * { box-sizing: border-box; }
  body {
    font-family: 'Bricolage Grotesque', -apple-system, 'Segoe UI', system-ui, sans-serif;
    margin: 0 auto; padding: 28px 20px 60px; max-width: 1200px;
    color: #16181d; background: #f7f7f8;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; }
  .subtitle { font-size: 12px; color: #6b7280; margin: 0 0 20px; }
  .stale-warning { background: #fff4e5; border: 1px solid #f3c988; border-radius: 8px; padding: 10px 14px; font-size: 12px; margin-bottom: 18px; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 26px; }
  .kpi { background: #fff; border: 1px solid #e8e9ec; border-radius: 10px; padding: 16px 18px; }
  .kpi-value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  .kpi-label { font-size: 11px; font-weight: 600; color: #374151; }
  .kpi-sub { font-size: 10px; color: #9ca3af; margin-top: 2px; }

  .controls { display: flex; gap: 18px; align-items: flex-end; margin-bottom: 16px; flex-wrap: wrap; }
  .controls label { font-size: 11px; font-weight: 600; color: #4b5563; display: flex; flex-direction: column; gap: 5px; }
  .controls select { padding: 7px 10px; font-size: 13px; font-weight: 400; border: 1px solid #d5d7dc; border-radius: 7px; background: #fff; min-width: 160px; }
  .checkbox-inline { flex-direction: row !important; align-items: center; gap: 7px !important; height: 34px; font-weight: 400; font-size: 12px; }
  .checkbox-inline input { width: auto; }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid #e8e9ec; border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 12px 15px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  th { background: #fbfbfc; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; font-weight: 700; }
  th.num, td.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  .hotel-row { cursor: pointer; }
  .hotel-row:hover { background: #fcfcfd; }
  .hotel-name { font-weight: 600; }
  .expand-arrow { display: inline-block; width: 14px; color: #9ca3af; font-size: 11px; }
  .stars { color: #d1a441; font-size: 11px; margin-left: 5px; }
  .ai-star-estimate { font-style: italic; border-bottom: 1px dashed #c8cad0; cursor: help; }
  .price { font-weight: 600; font-size: 14px; }
  .price-low { color: #0f7a3d; }
  .muted { color: #9ca3af; }
  .small { font-size: 11px; margin-top: 2px; }
  .nowrap { white-space: nowrap; }
  .rating-score { font-weight: 700; background: #eef4ff; color: #1e40af; border-radius: 5px; padding: 2px 7px; font-size: 12px; }
  .review-count { display: block; font-size: 11px; color: #6b7280; margin-top: 3px; }
  .review-count.thin { color: #b45309; }
  .badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.03em; border-radius: 4px; padding: 2px 6px; }
  .badge-new { background: #eef4ff; color: #1e40af; margin-left: 6px; }
  .badge-low { background: #e8f6ee; color: #0f7a3d; margin-top: 4px; }
  .badge-yt { background: #fee2e2; color: #b91c1c; margin-left: 6px; text-decoration: none; }
  a.view-link { color: #16181d; font-size: 12px; font-weight: 600; text-decoration: none; border-bottom: 1px solid #c8cad0; }

  .detail-row td { padding: 0; background: #fbfbfc; }
  .detail-row.hidden { display: none; }
  .sub-table { width: 100%; border-collapse: collapse; }
  .sub-table th { background: transparent; font-size: 9px; padding: 8px 15px 6px 40px; }
  .sub-table td { padding: 8px 15px 8px 40px; border-bottom: 1px solid #eee; font-size: 12px; }
  .sub-table tr:last-child td { border-bottom: none; }

  .hint { font-size: 12px; color: #6b7280; margin-top: 14px; }
  .hidden { display: none; }
  .empty { color: #6b7280; padding: 40px 0; text-align: center; }
</style>
</head>
<body>
  <h1>Resort Deal Dashboard</h1>
  <p class="subtitle" id="summary-line">Loading...</p>
  <div id="stale-warning" class="stale-warning hidden"></div>

  <div class="kpi-row" id="kpi-row"></div>

  <div class="controls">
    <label>Destination
      <select id="filter-destination"><option value="">All</option></select>
    </label>
    <label>Star tier
      <select id="filter-star">
        <option value="">Any</option>
        <option value="3">3+ star</option>
        <option value="4">4+ star</option>
        <option value="5">5 star</option>
      </select>
    </label>
    <label>Sort by
      <select id="sort-by">
        <option value="lowest">Lowest price</option>
        <option value="value">Best value (price vs rating)</option>
        <option value="discount">Closest to its all-time low</option>
        <option value="rating">Highest rated</option>
        <option value="youtube">Most YouTube views</option>
        <option value="checkin">Check-in date</option>
      </select>
    </label>
    <label class="checkbox-inline">
      <input type="checkbox" id="filter-quality" />
      Trustworthy reviews only
    </label>
    <label class="checkbox-inline">
      <input type="checkbox" id="filter-newly-built" />
      Newly built only
    </label>
    <label class="checkbox-inline">
      <input type="checkbox" id="filter-favorites" />
      Favorites only
    </label>
  </div>

  <table id="deals-table">
    <thead>
      <tr>
        <th>Hotel</th><th>Star tier</th><th>Destination</th><th>Cheapest dates</th>
        <th class="num">Price</th><th class="num">Lowest ever</th>
        <th>Guest rating</th><th>Tracking</th>
      </tr>
    </thead>
    <tbody id="deals-body"></tbody>
  </table>
  <p class="hint">Click a hotel to see all its tracked dates.</p>
  <div id="empty" class="empty hidden">Nothing published yet.</div>

  <script>
    const TRUSTWORTHY_MIN_RATING = 4.0;
    const TRUSTWORTHY_MIN_REVIEWS = 200;
    const YOUTUBE_POPULAR_THRESHOLD = 50000;

    let allGroups = [];

    function formatINR(amount) {
      if (amount === null || amount === undefined) return "N/A";
      const n = Math.abs(Math.round(amount));
      const s = String(n);
      let grouped;
      if (s.length <= 3) grouped = s;
      else {
        const last3 = s.slice(-3);
        let rest = s.slice(0, -3);
        const parts = [];
        while (rest.length > 2) { parts.unshift(rest.slice(-2)); rest = rest.slice(0, -2); }
        if (rest) parts.unshift(rest);
        grouped = parts.join(",") + "," + last3;
      }
      return (amount < 0 ? "-" : "") + "\u20b9" + grouped;
    }
    function formatViews(n) {
      if (n === null || n === undefined) return "";
      if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
      if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "K";
      return String(n);
    }
    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      return d.toLocaleDateString("en-IN", { day: "2-digit", month: "short" });
    }
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str ?? "";
      return d.innerHTML;
    }
    function escAttr(str) { return (str ?? "").replace(/"/g, "&quot;"); }

    /** Same fix as the extension: cleans up any hotel link published
     * before the domain-duplication bug was fixed. */
    function sanitizeUrl(url) {
      if (!url) return url;
      try {
        const u = new URL(url);
        const hostEscaped = u.hostname.replace(/\./g, "\\.");
        const dupRe = new RegExp("^/" + hostEscaped + "(/.*)$", "i");
        const m = dupRe.exec(u.pathname);
        if (m) u.pathname = m[1];
        return u.toString();
      } catch (e) {
        return url;
      }
    }

    function isTrustworthy(g) {
      return g.rating !== null && g.reviewCount !== null &&
        g.rating >= TRUSTWORTHY_MIN_RATING && g.reviewCount >= TRUSTWORTHY_MIN_REVIEWS;
    }

    function populateDestinationFilter(groups) {
      const select = document.getElementById("filter-destination");
      for (const d of [...new Set(groups.map((g) => g.destination))].sort()) {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d;
        select.appendChild(opt);
      }
    }

    function applyFiltersAndSort(groups) {
      const destFilter = document.getElementById("filter-destination").value;
      const starFilter = document.getElementById("filter-star").value;
      const sortBy = document.getElementById("sort-by").value;
      const qualityOnly = document.getElementById("filter-quality").checked;
      const newlyBuiltOnly = document.getElementById("filter-newly-built").checked;
      const favoritesOnly = document.getElementById("filter-favorites").checked;

      const filtered = groups.filter((g) => {
        if (destFilter && g.destination !== destFilter) return false;
        if (starFilter && (!g.starRating || g.starRating < parseInt(starFilter, 10))) return false;
        if (qualityOnly && !isTrustworthy(g)) return false;
        if (newlyBuiltOnly && !g.isNewlyBuilt) return false;
        if (favoritesOnly && !g.isFavorite) return false;
        return true;
      });

      switch (sortBy) {
        case "lowest": filtered.sort((a, b) => a.cheapestPrice - b.cheapestPrice); break;
        case "value":
          filtered.sort((a, b) => {
            const av = a.rating ? a.cheapestPrice / a.rating : Infinity;
            const bv = b.rating ? b.cheapestPrice / b.rating : Infinity;
            return av - bv;
          });
          break;
        case "discount": filtered.sort((a, b) => (a.cheapestPrice - a.lowestEver) - (b.cheapestPrice - b.lowestEver)); break;
        case "rating": filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0) || (b.reviewCount || 0) - (a.reviewCount || 0)); break;
        case "youtube": filtered.sort((a, b) => (b.youtubeViews || 0) - (a.youtubeViews || 0)); break;
        case "checkin": filtered.sort((a, b) => (a.dates[0]?.checkin || "").localeCompare(b.dates[0]?.checkin || "")); break;
      }
      return filtered;
    }

    function renderKpis(groups) {
      const cheapest = groups.slice().sort((a, b) => a.cheapestPrice - b.cheapestPrice)[0];
      const kpiRow = document.getElementById("kpi-row");
      kpiRow.innerHTML = `
        <div class="kpi">
          <div class="kpi-value">${cheapest ? formatINR(cheapest.cheapestPrice) : "\u2014"}</div>
          <div class="kpi-label">Cheapest tracked stay</div>
          <div class="kpi-sub">${cheapest ? esc(cheapest.hotelName) + " \u2022 " + esc(cheapest.destination) : ""}</div>
        </div>
        <div class="kpi"><div class="kpi-value">${groups.filter((g) => g.everAtLowest).length}</div><div class="kpi-label">At their lowest price</div></div>
        <div class="kpi"><div class="kpi-value">${groups.filter((g) => g.isNewlyBuilt).length}</div><div class="kpi-label">Newly built</div></div>
        <div class="kpi"><div class="kpi-value">${groups.filter(isTrustworthy).length}</div><div class="kpi-label">Well reviewed</div><div class="kpi-sub">4.0+ with 200+ reviews</div></div>
        <div class="kpi"><div class="kpi-value">${groups.filter((g) => g.youtubeViews >= YOUTUBE_POPULAR_THRESHOLD).length}</div><div class="kpi-label">Popular on YouTube</div><div class="kpi-sub">50K+ views</div></div>
      `;
    }

    function starTierDisplay(g) {
      if (g.manualStarTier) return `<span class="stars">${"\u2605".repeat(g.manualStarTier)}</span><span class="muted small"> (owner set)</span>`;
      if (g.starRating) return `<span class="stars">${"\u2605".repeat(g.starRating)}</span>`;
      if (g.aiEstimatedStarTier) return `<span class="muted small ai-star-estimate" title="AI estimate, not a verified rating">~${g.aiEstimatedStarTier}\u2605 (AI est.)</span>`;
      return '<span class="muted small">unrated</span>';
    }

    function ratingCell(g) {
      if (g.rating === null) return '<span class="muted">no rating</span>';
      const trust = isTrustworthy(g);
      const volumeNote = g.reviewCount === null ? "" :
        `<span class="review-count${trust ? "" : " thin"}">${g.reviewCount.toLocaleString("en-IN")} reviews</span>`;
      return `<span class="rating-score">${g.rating.toFixed(1)}</span>${volumeNote}`;
    }

    function renderTable(groups) {
      const body = document.getElementById("deals-body");
      const emptyEl = document.getElementById("empty");
      body.innerHTML = "";

      if (groups.length === 0) {
        emptyEl.classList.remove("hidden");
        return;
      }
      emptyEl.classList.add("hidden");

      groups.forEach((g, idx) => {
        const rowId = "hotel-row-" + idx;
        const cheapest = g.dates[0];
        const tr = document.createElement("tr");
        tr.className = "hotel-row";
        tr.innerHTML = `
          <td>
            <span class="expand-arrow">\u25b8</span>
            ${g.isFavorite ? '<span title="Favorited" style="color:#b8860b;margin-right:3px;">\u2605</span>' : ""}
            <span class="hotel-name">${esc(g.hotelName)}</span>
            ${g.isNewlyBuilt ? '<span class="badge badge-new">NEW BUILD</span>' : ""}
            ${g.youtubeViews ? `<a href="${escAttr(g.youtubeVideoUrl || "#")}" target="_blank" class="badge badge-yt" onclick="event.stopPropagation()">\u{1F3A5} ${formatViews(g.youtubeViews)}${g.youtubeVideoCount > 1 ? ` (${g.youtubeVideoCount}v)` : ""}</a>` : ""}
          </td>
          <td class="nowrap">${starTierDisplay(g)}</td>
          <td>${esc(g.destination)}<div class="muted small">${esc(g.source)}</div></td>
          <td class="nowrap">${cheapest.checkin} <div class="muted small">to ${cheapest.checkout}</div></td>
          <td class="num">
            <span class="price${g.everAtLowest ? " price-low" : ""}">${formatINR(g.cheapestPrice)}</span>
            ${g.everAtLowest ? '<div class="badge badge-low">lowest so far</div>' : ""}
          </td>
          <td class="num">${formatINR(g.lowestEver)}</td>
          <td>${ratingCell(g)}</td>
          <td class="muted small nowrap">${g.dates.length} date${g.dates.length > 1 ? "s" : ""}</td>
        `;
        body.appendChild(tr);

        const detailTr = document.createElement("tr");
        detailTr.id = rowId;
        detailTr.className = "detail-row hidden";
        const detailTd = document.createElement("td");
        detailTd.colSpan = 8;
        detailTd.innerHTML = `
          <table class="sub-table">
            <thead><tr><th>Dates</th><th class="num">Price</th><th class="num">Lowest seen</th><th>Last checked</th><th></th></tr></thead>
            <tbody>
              ${g.dates.map((d) => `
                <tr>
                  <td>${d.checkin} \u2192 ${d.checkout}</td>
                  <td class="num">${formatINR(d.price)}${d.price <= d.lowest ? '<span class="badge badge-low">lowest</span>' : ""}</td>
                  <td class="num">${formatINR(d.lowest)}</td>
                  <td class="muted small">${formatDate(d.updatedAt)}</td>
                  <td>${d.url ? `<a class="view-link" href="${escAttr(sanitizeUrl(d.url))}" target="_blank">View</a>` : ""}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        `;
        detailTr.appendChild(detailTd);
        body.appendChild(detailTr);

        tr.addEventListener("click", () => {
          detailTr.classList.toggle("hidden");
          tr.querySelector(".expand-arrow").textContent = detailTr.classList.contains("hidden") ? "\u25b8" : "\u25be";
        });
      });
    }

    function rerender() {
      renderTable(applyFiltersAndSort(allGroups));
    }

    async function main() {
      let data;
      try {
        const resp = await fetch("./data.json?t=" + Date.now(), { cache: "no-store" });
        data = await resp.json();
      } catch (e) {
        document.getElementById("summary-line").textContent = "Couldn't load data.json.";
        return;
      }

      allGroups = (data.groups || []).map((g) => ({ ...g, cheapest: g.dates[0] }));
      document.getElementById("summary-line").textContent =
        `${allGroups.length} hotels tracked \u2022 last updated ${new Date(data.generatedAt).toLocaleString("en-IN")}`;

      const ageMs = Date.now() - new Date(data.generatedAt).getTime();
      if (ageMs > 24 * 60 * 60 * 1000) {
        const warn = document.getElementById("stale-warning");
        warn.classList.remove("hidden");
        warn.textContent = "This snapshot is more than a day old, prices may have changed since.";
      }

      populateDestinationFilter(allGroups);
      renderKpis(allGroups);
      rerender();

      ["filter-destination", "filter-star", "sort-by", "filter-quality", "filter-newly-built", "filter-favorites"].forEach((id) => {
        document.getElementById(id).addEventListener("change", rerender);
      });
    }

    main();
  </script>
</body>
</html>
